server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сохранение графа схемы через прокси может быть крупнее обычного JSON
    # (модуль схем допускает до 8 МБ тела запроса).
    client_max_body_size 16m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend (если потребуется подключить реальный API)
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API модуля «Архитектурные схемы» (C4). Тот же origin, что и реестр,
    # поэтому список и карточка схем работают без CORS.
    location /diagrams-api/ {
        proxy_pass http://diagrams:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA модуля схем: canvas-редактор открывается внутри общего приложения
    # (ссылка ведёт на /diagrams-module/diagrams/<id>). Модуль остаётся
    # отдельным контейнером, но доступен на порту реестра.
    location = /diagrams-module {
        # Без завершающего слэша префикс не совпадает — направляем во встроенный путь.
        # $http_host сохраняет порт приложения: nginx иначе строит Location без порта.
        return 301 $scheme://$http_host/diagrams-module/;
    }

    location /diagrams-module/ {
        proxy_pass http://diagrams:3002/diagrams-module/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
