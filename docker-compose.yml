services:
  db:
    build:
      context: ./sql
      dockerfile: Dockerfile
    image: architecture-registry-postgres:2.0.0
    container_name: arch-registry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-architecture_registry}
      POSTGRES_USER: ${POSTGRES_USER:-registry_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-registry_admin} -d ${POSTGRES_DB:-architecture_registry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: architecture-registry-backend:2.0.0
    container_name: arch-registry-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-architecture_registry}
      POSTGRES_USER: ${POSTGRES_USER:-registry_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry_pass}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Адрес модуля схем для пункта меню «Архитектурные схемы».
        VITE_DIAGRAMS_URL: ${DIAGRAMS_PUBLIC_URL:-http://localhost:8082}
    image: architecture-registry-frontend:2.0.0
    container_name: arch-registry-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      # nginx проксирует /diagrams-api/ и /diagrams-module/ на модуль схем,
      # поэтому имя сервиса должно резолвиться уже при старте контейнера.
      diagrams:
        condition: service_healthy

  # Модуль визуализации реестра «Архитектурные схемы» (C4) — часть общего проекта:
  # исходники лежат рядом с backend/frontend/sql, поднимается тем же compose-файлом.
  diagrams:
    build:
      context: ./architecture-diagrams
      args:
        VITE_REGISTRY_URL: ${REGISTRY_PUBLIC_URL:-http://localhost:8080}
        # Встраивание модуля в общее приложение: префикс статики и клиентских
        # маршрутов (nginx реестра проксирует его) и база API модуля.
        VITE_BASE_PATH: ${DIAGRAMS_BASE_PATH:-/diagrams-module/}
        VITE_API_BASE: ${DIAGRAMS_API_BASE:-/diagrams-api}
    image: architecture-diagrams-module:1.0.0
    container_name: arch-diagrams-module
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: production
      # Префикс, под которым сервис отдаёт SPA модуля для общего приложения.
      APP_BASE: ${DIAGRAMS_BASE_PATH:-/diagrams-module}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-architecture_registry}
      POSTGRES_USER: ${POSTGRES_USER:-registry_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry_pass}
      CORS_ORIGIN: ${DIAGRAMS_CORS_ORIGIN:-http://localhost:8082}
      DEFAULT_ROLE: ${DIAGRAMS_DEFAULT_ROLE:-ARCHITECT}
      MODULE_USER: ${DIAGRAMS_USER:-diagram-module}
    ports:
      - "${DIAGRAMS_PORT:-8082}:3002"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pg_data:
